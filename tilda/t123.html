<!-- Paste into CONTENT of existing T123 block at-hod; do not create a new block -->
<div id="at-hod-gallery" class="cp-gallery">
  <div class="cp-tabs" id="cp-tabs"></div>
  <div class="cp-layout">
    <button type="button" class="cp-arrow" id="cp-prev" aria-label="Предыдущий месяц">&#10094;</button>
    <div class="cp-cards" id="cp-cards"></div>
    <button type="button" class="cp-arrow" id="cp-next" aria-label="Следующий месяц">&#10095;</button>
  </div>
</div>
<style>
#at-hod-gallery{font-family:Arial,sans-serif;max-width:1200px;margin:0 auto}
#at-hod-gallery .cp-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
#at-hod-gallery .cp-tabs button{padding:9px 15px;border:1px solid #ddd;border-radius:22px;background:white;cursor:pointer;font:inherit}
#at-hod-gallery .cp-tabs button.active{background:#292929;color:white}
#at-hod-gallery .cp-layout{display:flex;align-items:center;gap:10px}
#at-hod-gallery .cp-arrow{border:1px solid #ddd;border-radius:50%;background:white;cursor:pointer;min-width:38px;height:38px}
#at-hod-gallery .cp-cards{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;flex:1}
#at-hod-gallery .cp-card{flex:0 0 min(340px,86vw);scroll-snap-align:start}
#at-hod-gallery .cp-card h3{font-size:20px;margin:0 0 14px}
#at-hod-gallery .cp-unit{margin:10px 0;font-size:14px}
#at-hod-gallery .cp-photo{display:block;width:100%;height:230px;object-fit:cover;border-radius:8px;margin-bottom:8px}
</style>
<script>
(async function(){
  const root=document.getElementById('at-hod-gallery');
  if(!root)return;
  const cards=root.querySelector('#cp-cards'),tabs=root.querySelector('#cp-tabs');
  let selected='Все фото';
  const units=['Все фото',...Array.from({length:8},(_,i)=>'Литер '+(i+1))];
  try {
    const resp=await fetch('https://trestfam.github.io/construction-progress/atmosfera.json',{cache:'no-store'});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const data=await resp.json(), entries=data.entries||[];
    function draw(){
      tabs.replaceChildren();cards.replaceChildren();
      for(const name of units){
        const b=document.createElement('button');b.type='button';b.textContent=name;
        b.className=name===selected?'active':'';
        b.onclick=()=>{selected=name;draw();};tabs.appendChild(b);
      }
      const months=new Map();
      for(const entry of entries){
        if(selected!=='Все фото'&&selected!==entry.unit)continue;
        if(!months.has(entry.month))months.set(entry.month,{title:entry.title,rows:[]});
        months.get(entry.month).rows.push(entry);
      }
      for(const group of months.values()){
        const card=document.createElement('article');card.className='cp-card';
        const heading=document.createElement('h3');heading.textContent=group.title;card.appendChild(heading);
        for(const row of group.rows){
          if(selected==='Все фото'){const unit=document.createElement('div');unit.className='cp-unit';unit.textContent=row.unit;card.appendChild(unit);}
          for(const photo of row.photos){
            const a=document.createElement('a');a.href=photo.url;a.target='_blank';a.rel='noopener noreferrer';
            const img=document.createElement('img');img.loading='lazy';img.src=photo.url;img.alt=row.unit+' — '+group.title;img.className='cp-photo';
            a.appendChild(img);card.appendChild(a);
          }
        }
        cards.appendChild(card);
      }
      if(!months.size)cards.textContent='Фотографии пока не опубликованы.';
    }
    draw();
    root.querySelector('#cp-prev').onclick=()=>cards.scrollBy({left:-360,behavior:'smooth'});
    root.querySelector('#cp-next').onclick=()=>cards.scrollBy({left:360,behavior:'smooth'});
  }catch(error){cards.textContent='Не удалось загрузить фотографии.';console.error('construction progress',error);}
})();
</script>
